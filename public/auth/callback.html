<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signing in…</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <meta name="theme-color" content="#0B120E" />
  <style>
    /* Dark by default so the sign-in hand-off doesn't flash white. */
    body { font-family: 'Schibsted Grotesk', -apple-system, sans-serif; display: flex; align-items: center;
           justify-content: center; min-height: 100vh; margin: 0; background: #0B120E; color: #EEF2EC; }
    p { font-size: 1rem; color: #9DAA9F; }
    html[data-theme='light'] body { background: #FBFBF8; color: #141E19; }
    html[data-theme='light'] p { color: #4C5A53; }
  </style>
  <script>
    (function () {
      try {
        if (localStorage.getItem('tt-theme') === 'light') {
          document.documentElement.dataset.theme = 'light';
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <p>Signing in…</p>
  <script>
    // Anon key is safe in the browser (RLS enforced). Keep in sync with the app client.
    const SUPABASE_URL  = 'https://nmwlebcvezybfwertlzs.supabase.co';
    const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5td2xlYmN2ZXp5YmZ3ZXJ0bHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNTUzMjcsImV4cCI6MjA5MTkzMTMyN30.N8Q8T6Mf9_AdzysqgD46tOYMnmB8xTNerU9q7GM7Rlg';

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { persistSession: true, detectSessionInUrl: true },
    });

    sb.auth.getSession().then(() => {
      let next = window.location.origin + '/app/';
      try {
        const stored = sessionStorage.getItem('tt_auth_return_to');
        if (stored && stored.startsWith(window.location.origin)) next = stored;
        sessionStorage.removeItem('tt_auth_return_to');
      } catch {
        // ignore
      }
      window.location.replace(next);
    });
  </script>
</body>
</html>
