<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tee-Time · Opening round…</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B120E" />
  <link rel="canonical" href="/app/" />
  <!--
    Legacy standalone voter page. Rounds now live in the app at /app/round/:slug, and
    shareable links go through /round/:slug (see functions/round/[[slug]].js).

    Old links used the round's UUID (?id=…) rather than its share_slug, so this page
    resolves the slug via the public Supabase read before redirecting. Any failure
    falls through to /app/ so the link is never a dead end.
  -->
  <style>
    html { color-scheme: dark; }
    body {
      margin: 0; padding: 2rem;
      background: #0B120E; color: #EEF2EC;
      font-family: 'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, sans-serif;
    }
    a { color: #C6F24E; }
    @media (prefers-color-scheme: light) {
      html { color-scheme: light; }
      body { background: #FBFBF8; color: #141E19; }
      a { color: #4C7A22; }
    }
  </style>
</head>
<body>
  <p>Opening the round… <a id="fallback" href="/app/">Continue to tee-time.io</a></p>
  <script>
    (function () {
      var SUPABASE_URL = 'https://nmwlebcvezybfwertlzs.supabase.co';
      var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5td2xlYmN2ZXp5YmZ3ZXJ0bHpzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNTUzMjcsImV4cCI6MjA5MTkzMTMyN30.N8Q8T6Mf9_AdzysqgD46tOYMnmB8xTNerU9q7GM7Rlg';

      var id = new URLSearchParams(location.search).get('id') || '';
      var go = function (path) { location.replace(path); };

      // Only a well-formed UUID is worth a lookup; anything else goes straight to the app.
      if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) {
        go('/app/');
        return;
      }

      fetch(
        SUPABASE_URL + '/rest/v1/rounds?id=eq.' + encodeURIComponent(id) + '&select=share_slug&limit=1',
        { headers: { apikey: SUPABASE_ANON, Authorization: 'Bearer ' + SUPABASE_ANON } }
      )
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (rows) {
          var slug = Array.isArray(rows) && rows[0] && rows[0].share_slug;
          go(slug ? '/app/round/' + encodeURIComponent(slug) + '/' : '/app/');
        })
        .catch(function () { go('/app/'); });
    })();
  </script>
</body>
</html>
