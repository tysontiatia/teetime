#   VAPID_PRIVATE_KEY   (Web Push — pair with VAPID_PUBLIC_KEY above)

[triggers]
# UTC heartbeats — golf hours and tiers are gated in America/Denver inside the worker.
# * * * * *     → alert micro-poller (watched pairs only, 24/7)
# */5 * * * *   → full catalog poller (Finder snapshots; golf hours only)
# */15 6-23     → notification backstop
# */15 * * * *  → course-catalog photo/coordinate enrichment (not golf-hours-gated)
crons = ["* * * * *", "*/5 * * * *", "*/15 6-23 * * *", "*/15 * * * *"]
